
<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login</title>

    <style>

        /* ================================
           RESET
        ================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f6f9;
            color: #1e293b;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ================================
           CONTAINER
        ================================= */

        .container {
            width: 100%;
            max-width: 1000px;
            min-height: 600px;

            display: grid;
            grid-template-columns: 1fr 1fr;

            background: #ffffff;

            border: 1px solid #e2e8f0;
            border-radius: 16px;

            overflow: hidden;

            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.07);
        }

        /* ================================
           ÁREA DO LOGIN
        ================================= */

        .s-cadastro {
            display: flex;
            align-items: center;
            justify-content: center;

            padding: 50px;
        }

        /* ================================
           FORMULÁRIO
        ================================= */

        .form-box {
            width: 100%;
            max-width: 400px;
        }

        .form-box h2 {
            font-size: 30px;
            font-weight: 700;

            color: #0f172a;

            margin-bottom: 8px;
        }

        .form-box > p {
            color: #64748b;

            font-size: 14px;

            margin-bottom: 30px;
        }

        /* ================================
           CAMPOS
        ================================= */

        .grupo-campo {
            margin-bottom: 22px;
        }

        .grupo-campo label {
            display: block;

            margin-bottom: 8px;

            color: #475569;

            font-size: 14px;
            font-weight: 600;
        }

        .grupo-campo input {
            width: 100%;
            height: 48px;

            border: 1px solid #cbd5e1;
            border-radius: 9px;

            padding: 0 14px;

            background: #ffffff;
            color: #0f172a;

            font-size: 15px;

            outline: none;

            transition: 0.2s ease;
        }

        .grupo-campo input:hover {
            border-color: #94a3b8;
        }

        .grupo-campo input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        /* ================================
           BOTÃO
        ================================= */

        .bt-submit {
            width: 100%;
            height: 48px;

            border: none;
            border-radius: 9px;

            background: #2563eb;
            color: #ffffff;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .bt-submit:hover {
            background: #1d4ed8;

            transform: translateY(-1px);
        }

        .bt-submit:active {
            transform: translateY(0);
        }

        /* ================================
           MENSAGEM
        ================================= */

        #mensagem {
            margin-top: 20px;

            min-height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 10px 16px;

            background: #ffffff;

            border: 1px solid #e2e8f0;
            border-radius: 9px;

            color: #475569;

            font-size: 14px;
            font-weight: 500;

            box-shadow:
                0 5px 15px rgba(15, 23, 42, 0.04);
        }

        /* ================================
           LINK
        ================================= */

        .form-box a {
            display: block;

            margin-top: 20px;

            text-align: center;

            color: #2563eb;

            font-size: 14px;
            font-weight: 500;

            text-decoration: none;

            transition: 0.2s ease;
        }

        .form-box a:hover {
            color: #1d4ed8;
        }

        /* ================================
           APRESENTAÇÃO
        ================================= */

        .s-apresentacao {
            background: #0f172a;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 50px;
        }

        .s-apresentacao h1 {
            color: #ffffff;

            font-size: 32px;
            line-height: 1.25;

            text-align: center;

            font-weight: 700;
        }

        /* ================================
           RESPONSIVO
        ================================= */

        @media (max-width: 700px) {

            body {
                padding: 20px;
            }

            .container {
                grid-template-columns: 1fr;

                min-height: auto;
            }

            .s-cadastro {
                padding: 35px 25px;
            }

            .s-apresentacao {
                padding: 35px 25px;

                min-height: 180px;
            }

            .s-apresentacao h1 {
                font-size: 24px;
            }
        }

    </style>

</head>


<body>

    <div class="container">

        <!-- LOGIN -->

        <main class="s-cadastro">

            <div class="form-box">

                <h2>LOGIN</h2>

                <p>Entre na sua conta.</p>


                <form id="form-login">

                    <!-- EMAIL -->

                    <div class="grupo-campo">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                        >

                    </div>


                    <!-- SENHA -->

                    <div class="grupo-campo">

                        <label for="password">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                        >

                    </div>


                    <!-- BOTÃO -->

                    <button
                        type="submit"
                        class="bt-submit"
                    >
                        Conectar
                    </button>


                    <!-- MENSAGEM -->

                    <p id="mensagem"></p>


                    <!-- CADASTRO -->

                    <a href="index.html">
                        Ainda não possui uma conta? Clique aqui.
                    </a>

                </form>

            </div>

        </main>


        <!-- APRESENTAÇÃO -->

        <aside class="s-apresentacao">

            <h1>
                Sistema de Gerenciamento de Estoque e Vendas
            </h1>

        </aside>

    </div>


    <!-- ================================
         LOGIN / API
    ================================= -->

    <script>

        const formulario =
            document.getElementById("form-login");


        const campoEmail =
            document.getElementById("email");


        const campoSenha =
            document.getElementById("password");


        const mensagem =
            document.getElementById("mensagem");


        formulario.addEventListener(
            "submit",
            async (evento) => {

                evento.preventDefault();


                const usuario = {

                    Email:
                        campoEmail.value.trim(),

                    Senha:
                        campoSenha.value

                };


                try {

                    const resposta =
                        await fetch(
                            "http://127.0.0.1:3000/usuarios/login",
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body:
                                    JSON.stringify(usuario)

                            }
                        );


                    const dados =
                        await resposta.json();


                    if (!resposta.ok) {

                        throw new Error(
                            dados.mensagem ||
                            "Erro ao fazer login."
                        );

                    }


                    mensagem.textContent =
                        dados.mensagem;


                    /*
                        Guarda o usuário
                        que fez login.
                    */

                    localStorage.setItem(
                        "usuario",
                        JSON.stringify(
                            dados.usuario
                        )
                    );


                    console.log(
                        "Usuário logado:",
                        dados.usuario
                    );


                    formulario.reset();


                    /*
                        Depois do login,
                        entra no sistema.
                    */

                    setTimeout(() => {

                        window.location.href =
                            "cadastro_produto.html";

                    }, 1000);


                } catch (erro) {

                    mensagem.textContent =
                        "Erro ao entrar: " +
                        erro.message;

                }

            }
        );

    </script>

</body>

</html>
