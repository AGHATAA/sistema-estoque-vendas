<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <!--CADASTRO-->
        <main class="s-cadastro">
            <!--SEÇÃO DE CADASTRO-->
            <div class="form-box">
                <h2>Login</h2>
                <p>Entre na sua conta.</p>
                
                <form action="#" method="post">
                    <!--EMAIL-->
                    <div class="grupo-campo">
                        <label for="email">Email</label> <br>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <!--SENHA-->
                    <div class="grupo-campo">
                        <label for="password">Senha</label> <br>
                        <input type="password" id="password" name="password" required> 
                    </div>

                    <button type="submit" class="bt-submit">Conectar</button> <br>
                </form>                
            </div>
        </main>
        <aside class="s-apresentacao">
            <h1>Sistema de Gerenciamento de Estoque e Vendas</h1>
        </aside>
    </div>
</body>
</html>
