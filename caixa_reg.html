<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixa Registradora</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f6f9;
            color: #1e293b;
        }

        /* ================================
           CABEÇALHO
        ================================= */

        .cabecalho {
            height: 72px;
            background: #0f172a;

            display: flex;
            align-items: center;

            padding: 0 60px;

            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.12);
        }

        .cabecalho nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cabecalho a {
            color: #cbd5e1;
            text-decoration: none;

            font-size: 14px;
            font-weight: 500;

            padding: 11px 18px;

            border-radius: 8px;

            transition: 0.2s ease;
        }

        .cabecalho a:hover {
            background: #1e293b;
            color: #ffffff;
        }

        .cabecalho a:first-child {
            background: #2563eb;
            color: #ffffff;
        }

        .cabecalho a:first-child:hover {
            background: #1d4ed8;
        }


        /* ================================
           ÁREA PRINCIPAL
        ================================= */

        .caixa {
            width: 100%;
            max-width: 1200px;

            margin: 45px auto;

            padding: 0 25px;
        }


        /* ================================
           BUSCA
        ================================= */

        .buscar-produto {

            background: #ffffff;

            border: 1px solid #e2e8f0;

            border-radius: 16px;

            padding: 30px;

            margin-bottom: 25px;

            box-shadow:
                0 10px 30px rgba(15, 23, 42, 0.06);
        }

        .buscar-produto form {

            display: flex;

            align-items: end;

            gap: 15px;

            flex-wrap: wrap;
        }

        .campo {

            display: flex;

            flex-direction: column;
        }

        .buscar-produto label {

            margin-bottom: 8px;

            color: #475569;

            font-size: 14px;

            font-weight: 600;
        }

        .buscar-produto input {

            height: 46px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            padding: 0 14px;

            font-size: 14px;

            color: #0f172a;

            outline: none;

            transition: 0.2s ease;
        }

        #text {
            width: 280px;
        }

        #number {
            width: 120px;
        }

        .buscar-produto input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37, 99, 235, 0.12);
        }


        /* ================================
           BOTÕES
        ================================= */

        .btn-buscar,
        .btn-finalizar,
        .btn-remover {

            height: 46px;

            padding: 0 22px;

            border: none;

            border-radius: 9px;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .btn-buscar {

            background: #2563eb;

            color: #ffffff;
        }

        .btn-buscar:hover {

            background: #1d4ed8;

            transform: translateY(-1px);
        }

        .btn-finalizar {

            background: #16a34a;

            color: #ffffff;
        }

        .btn-finalizar:hover {

            background: #15803d;

            transform: translateY(-1px);
        }

        .btn-remover {

            background: #dc2626;

            color: #ffffff;
        }

        .btn-remover:hover {

            background: #b91c1c;

            transform: translateY(-1px);
        }


        /* ================================
           TABELA
        ================================= */

        .tabela-container {

            background: #ffffff;

            border: 1px solid #e2e8f0;

            border-radius: 16px;

            overflow: hidden;

            box-shadow:
                0 10px 30px rgba(15, 23, 42, 0.06);
        }

        table {

            width: 100%;

            border-collapse: collapse;
        }

        thead {

            background: #f8fafc;
        }

        th {

            padding: 17px 20px;

            text-align: left;

            color: #475569;

            font-size: 12px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.04em;

            border-bottom: 1px solid #e2e8f0;
        }

        td {

            padding: 18px 20px;

            color: #334155;

            font-size: 14px;

            border-bottom: 1px solid #f1f5f9;
        }

        tbody tr:hover {

            background: #f8fafc;
        }

        tbody tr:last-child td {

            border-bottom: none;
        }


        /* ================================
           TOTAL
        ================================= */

        .total-compra {

            margin-top: 25px;

            background: #0f172a;

            border-radius: 16px;

            padding: 25px 30px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 10px 30px rgba(15, 23, 42, 0.10);
        }

        .total-compra h2 {

            color: #cbd5e1;

            font-size: 16px;

            font-weight: 500;
        }

        #valor-total {

            color: #ffffff;

            font-size: 28px;

            font-weight: 700;
        }


        /* ================================
           MENSAGEM
        ================================= */

        #mensagem {

            margin-top: 18px;

            color: #475569;

            font-size: 14px;

            font-weight: 500;
        }


        /* ================================
           RESPONSIVO
        ================================= */

        @media (max-width: 800px) {

            .cabecalho {

                padding: 0 20px;
            }

            .cabecalho nav {

                flex-wrap: wrap;
            }

            .cabecalho a {

                padding: 9px 10px;

                font-size: 12px;
            }

            .caixa {

                margin: 30px auto;

                padding: 0 15px;
            }

            .buscar-produto form {

                flex-direction: column;

                align-items: stretch;
            }

            #text,
            #number {

                width: 100%;
            }

            .btn-buscar,
            .btn-finalizar,
            .btn-remover {

                width: 100%;
            }

            .tabela-container {

                overflow-x: auto;
            }

            table {

                min-width: 600px;
            }

            .total-compra {

                flex-direction: column;

                align-items: flex-start;

                gap: 10px;
            }
        }

    </style>
</head>


<body>

    <!-- HEADER -->

    <header class="cabecalho">

        <nav>

            <a href="caixa_reg.html">
                Caixa Registradora
            </a>

            <a href="estoque.html">
                Estoque
            </a>

            <a href="cadastro_produto.html">
                Cadastro de Produto
            </a>

        </nav>

    </header>


    <!-- MAIN -->

    <main class="caixa">


        <!-- BUSCAR PRODUTO -->

        <div class="buscar-produto">

            <form id="form-caixa">

                <div class="campo">

                    <label for="text">
                        Código do produto
                    </label>

                    <input
                        type="text"
                        id="text"
                        name="codigo_produto"
                        placeholder="Ex: TEC-001"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="number">
                        Quantidade
                    </label>

                    <input
                        type="number"
                        id="number"
                        name="quantidade"
                        min="1"
                        step="1"
                        value="1"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn-buscar">

                    Buscar

                </button>


                <button
                    type="button"
                    id="btn-finalizar"
                    class="btn-finalizar">

                    Finalizar compra

                </button>


                <button
                    type="button"
                    id="btn-remover"
                    class="btn-remover">

                    Remover produto

                </button>

            </form>


            <p id="mensagem"></p>

        </div>


        <!-- TABELA -->

        <section class="tabela-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Produto
                        </th>

                        <th>
                            Código
                        </th>

                        <th>
                            Qtd
                        </th>

                        <th>
                            Preço
                        </th>

                        <th>
                            Subtotal
                        </th>

                    </tr>

                </thead>


                <tbody id="lista-produtos">

                    <!-- Produtos adicionados à compra aparecerão aqui -->

                </tbody>

            </table>

        </section>


        <!-- TOTAL -->

        <section class="total-compra">

            <h2>
                Total da compra
            </h2>

            <output id="valor-total">
                R$ 0,00
            </output>

        </section>


    </main>


    <script>

        const API =
            "http://127.0.0.1:3000/produtos";


        const formulario =
            document.getElementById("form-caixa");


        const campoCodigo =
            document.getElementById("text");


        const campoQuantidade =
            document.getElementById("number");


        const listaProdutos =
            document.getElementById("lista-produtos");


        const valorTotal =
            document.getElementById("valor-total");


        const mensagem =
            document.getElementById("mensagem");


        const btnRemover =
            document.getElementById("btn-remover");


        const btnFinalizar =
            document.getElementById("btn-finalizar");


        // Produtos que estão na compra

        let carrinho = [];


        // ==========================================
        // MENSAGEM
        // ==========================================

        function mostrarMensagem(texto) {

            mensagem.textContent = texto;

        }


        // ==========================================
        // ATUALIZAR TABELA
        // ==========================================

        function atualizarTabela() {

            listaProdutos.innerHTML = "";


            carrinho.forEach((item, indice) => {

                const linha =
                    document.createElement("tr");


                linha.innerHTML = `

                    <td>
                        ${item.Nome}
                    </td>

                    <td>
                        ${item.CodigoProduto}
                    </td>

                    <td>
                        ${item.Quantidade}
                    </td>

                    <td>
                        R$ ${item.Preco
                            .toFixed(2)
                            .replace(".", ",")}
                    </td>

                    <td>
                        R$ ${item.Subtotal
                            .toFixed(2)
                            .replace(".", ",")}
                    </td>

                `;


                listaProdutos.appendChild(linha);

            });


            calcularTotal();

        }


        // ==========================================
        // CALCULAR TOTAL
        // ==========================================

        function calcularTotal() {

            const total =
                carrinho.reduce(
                    (soma, item) =>
                        soma + item.Subtotal,
                    0
                );


            valorTotal.textContent =
                "R$ " +
                total.toFixed(2).replace(".", ",");

        }


        // ==========================================
        // BUSCAR PRODUTO
        // ==========================================

        formulario.addEventListener(
            "submit",
            async (evento) => {

                evento.preventDefault();


                const codigo =
                    campoCodigo.value.trim();


                const quantidade =
                    Number(campoQuantidade.value);


                if (!codigo) {

                    mostrarMensagem(
                        "Informe o código do produto."
                    );

                    return;
                }


                if (
                    !Number.isInteger(quantidade) ||
                    quantidade <= 0
                ) {

                    mostrarMensagem(
                        "Informe uma quantidade válida."
                    );

                    return;
                }


                try {

                    mostrarMensagem(
                        "Buscando produto..."
                    );


                    const resposta =
                        await fetch(API);


                    const produtos =
                        await resposta.json();


                    if (!resposta.ok) {

                        throw new Error(
                            "Erro ao consultar produtos."
                        );

                    }


                    const produto =
                        produtos.find(
                            item =>
                                item.CodigoProduto
                                    .toLowerCase() ===
                                codigo.toLowerCase()
                                &&
                                item.Ativo === true
                        );


                    if (!produto) {

                        mostrarMensagem(
                            "Produto não encontrado ou está inativo."
                        );

                        return;
                    }


                    // Verificar estoque

                    if (
                        quantidade >
                        produto.Quantidade
                    ) {

                        mostrarMensagem(
                            `Estoque insuficiente. Disponível: ${produto.Quantidade}`
                        );

                        return;
                    }


                    // Verificar se já está no carrinho

                    const itemExistente =
                        carrinho.find(
                            item =>
                                item.CodigoProduto
                                    .toLowerCase() ===
                                produto.CodigoProduto
                                    .toLowerCase()
                        );


                    if (itemExistente) {

                        const novaQuantidade =
                            itemExistente.Quantidade +
                            quantidade;


                        if (
                            novaQuantidade >
                            produto.Quantidade
                        ) {

                            mostrarMensagem(
                                `Estoque insuficiente. Disponível: ${produto.Quantidade}`
                            );

                            return;
                        }


                        itemExistente.Quantidade =
                            novaQuantidade;


                        itemExistente.Subtotal =
                            itemExistente.Quantidade *
                            itemExistente.Preco;

                    } else {

                        carrinho.push({

                            IdProduto:
                                produto.IdProduto,

                            Nome:
                                produto.Nome,

                            CodigoProduto:
                                produto.CodigoProduto,

                            Preco:
                                Number(produto.Preco),

                            Quantidade:
                                quantidade,

                            Subtotal:
                                Number(produto.Preco) *
                                quantidade

                        });

                    }


                    atualizarTabela();


                    mostrarMensagem(
                        `${produto.Nome} adicionado à compra.`
                    );


                    campoCodigo.value = "";

                    campoQuantidade.value = 1;

                    campoCodigo.focus();


                } catch (erro) {

                    console.error(erro);

                    mostrarMensagem(
                        "Erro ao buscar produto: " +
                        erro.message
                    );

                }

            }
        );


        // ==========================================
        // REMOVER PRODUTO
        // ==========================================

        btnRemover.addEventListener(
            "click",
            () => {

                const codigo =
                    campoCodigo.value.trim();


                if (!codigo) {

                    mostrarMensagem(
                        "Informe o código do produto para remover."
                    );

                    return;
                }


                const indice =
                    carrinho.findIndex(
                        item =>
                            item.CodigoProduto
                                .toLowerCase() ===
                            codigo.toLowerCase()
                    );


                if (indice === -1) {

                    mostrarMensagem(
                        "Esse produto não está na compra."
                    );

                    return;
                }


                carrinho.splice(indice, 1);


                atualizarTabela();


                mostrarMensagem(
                    "Produto removido da compra."
                );


                campoCodigo.value = "";

                campoQuantidade.value = 1;

            }
        );

// ==========================================
// FINALIZAR COMPRA
// ==========================================

btnFinalizar.addEventListener(
    "click",
    async () => {

        if (carrinho.length === 0) {

            mostrarMensagem(
                "Adicione pelo menos um produto à compra."
            );

            return;
        }


        try {

            mostrarMensagem(
                "Finalizando compra..."
            );


            const venda = {

                IdUsuario: 1,

                produtos: carrinho.map(item => ({

                    IdProduto: item.IdProduto,

                    Quantidade: item.Quantidade

                }))

            };


            const resposta =
                await fetch(
                    "http://127.0.0.1:3000/vendas",
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(venda)

                    }
                );


            const resultado =
                await resposta.json();


            if (!resposta.ok) {

                throw new Error(
                    resultado.mensagem ||
                    "Erro ao finalizar venda."
                );

            }


            mostrarMensagem(
                `${resultado.mensagem} Total: R$ ${Number(resultado.ValorTotal)
                    .toFixed(2)
                    .replace(".", ",")}`
            );


            console.log(
                "Venda realizada:",
                resultado
            );


            // Limpar carrinho

            carrinho = [];


            atualizarTabela();


            campoCodigo.value = "";

            campoQuantidade.value = 1;

            campoCodigo.focus();


        } catch (erro) {

            console.error(erro);


            mostrarMensagem(
                "Erro ao finalizar compra: " +
                erro.message
            );

        }

    }
);

    </script>

</body>
</html>
