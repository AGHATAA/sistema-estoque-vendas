<!DOCTYPE html>
<html lang="pt-br
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caixa Registradora</title>
</head>
<body>
    <!--HEADER-->
    <header class="cabecalho"> 
        <nav>
            <a href="caixa_reg.html"> Caixa Registradora </a> |
            <a href="#"> Estoque </a> |
            <a href="#"> Cadastro de Estoque </a>
        </nav>
    </header>

    <!--MAIN-->
    <main>
        <!--FORMULARIO BUSCA DE PRODUTOS-->
        <div class="buscar-produto">
            <form action="#" method="post">
                <label for="text">Codigo do produto</label>
                <input type="text" id="text" name="codigo_produto" required>

                <label for="number">Qtd</label>
                <input type="number" id="number" name="quantidade" required>

                <button type="submit" name="acao" class="btn-buscar">Buscar</button>
                <button type="submit" name="acao" class="btn-finalizar">Finalizar compra</button>
                <button type="submit" name="acao" class="btn-remover">Remover produto</button>
            </form>
        </div>

        <!--TABELA DE PRODUTOS-->
        <section class="tabela-container">
            <table>
                <tr>
                    <th>N. produto</th>
                    <th>Qtd</th>
                    <th>Preço</th>
                    <th>Subtotal</th>
                </tr>
            </table>

        </section>
        
    </main>
    
</body>
</html>
