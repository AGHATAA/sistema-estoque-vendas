<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque</title>

    <style>
        /* ================================
           RESET
        ================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f6f9;
            color: #1e293b;
        }

        /* ================================
           CABEÇALHO
        ================================= */

        .cabecalho {
            height: 72px;
            background: #0f172a;
            display: flex;
            align-items: center;
            padding: 0 60px;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.12);
        }

        .cabecalho nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cabecalho a {
            color: #cbd5e1;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 11px 18px;
            border-radius: 8px;
            transition: 0.2s ease;
        }

        .cabecalho a:hover {
            background: #1e293b;
            color: #ffffff;
        }

        .cabecalho a:nth-child(2) {
            background: #2563eb;
            color: #ffffff;
        }

        .cabecalho a:nth-child(2):hover {
            background: #1d4ed8;
        }

        /* ================================
           ÁREA PRINCIPAL
        ================================= */

        .estoque {
            width: 100%;
            max-width: 1200px;
            margin: 45px auto;
            padding: 0 25px;
        }

        /* ================================
           ÁREA DE BUSCA
        ================================= */

        .cad_produto {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 30px;

            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);

            margin-bottom: 25px;
        }

        .cad_produto form {
            display: flex;
            align-items: end;
            gap: 15px;
        }

        .cad_produto label {
            display: block;
            margin-bottom: 8px;

            color: #475569;
            font-size: 14px;
            font-weight: 600;
        }

        .cad_produto input {
            width: 350px;
            height: 46px;

            border: 1px solid #cbd5e1;
            border-radius: 9px;

            padding: 0 14px;

            font-size: 14px;
            color: #0f172a;

            outline: none;

            transition: 0.2s ease;
        }

        .cad_produto input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .btn-buscar {
            height: 46px;
            padding: 0 25px;

            border: none;
            border-radius: 9px;

            background: #2563eb;
            color: #ffffff;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .btn-buscar:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        /* ================================
           TABELA
        ================================= */

        .tabela-container {
            background: #ffffff;

            border: 1px solid #e2e8f0;
            border-radius: 16px;

            overflow: hidden;

            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8fafc;
        }

        th {
            padding: 17px 20px;

            text-align: left;

            color: #475569;

            font-size: 12px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.04em;

            border-bottom: 1px solid #e2e8f0;
        }

        td {
            padding: 18px 20px;

            color: #334155;

            font-size: 14px;

            border-bottom: 1px solid #f1f5f9;
        }

        tbody tr {
            transition: 0.15s ease;
        }

        tbody tr:hover {
            background: #f8fafc;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* ================================
           ESTADO DO ESTOQUE
        ================================= */

        .estoque-normal {
            color: #15803d;
            font-weight: 600;
        }

        .estoque-baixo {
            color: #dc2626;
            font-weight: 600;
        }

        /* ================================
           MENSAGEM
        ================================= */

        #mensagem {
            margin-top: 18px;

            color: #475569;

            font-size: 14px;
            font-weight: 500;
        }

        /* ================================
           RESPONSIVO
        ================================= */

        @media (max-width: 800px) {

            .cabecalho {
                padding: 0 20px;
            }

            .cabecalho nav {
                flex-wrap: wrap;
            }

            .cabecalho a {
                padding: 9px 10px;
                font-size: 12px;
            }

            .estoque {
                margin: 30px auto;
                padding: 0 15px;
            }

            .cad_produto form {
                flex-direction: column;
                align-items: stretch;
            }

            .cad_produto input {
                width: 100%;
            }

            .btn-buscar {
                width: 100%;
            }

            .tabela-container {
                overflow-x: auto;
            }

            table {
                min-width: 750px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header class="cabecalho">
        <nav>
            <a href="caixa_reg.html">Caixa Registradora</a>
            <a href="estoque.html">Estoque</a>
            <a href="cadastro_produto.html">Cadastro de Produto</a>
        </nav>
    </header>


    <!-- MAIN -->

    <main class="estoque">

        <!-- BUSCAR PRODUTO -->

        <div class="cad_produto">

            <form id="form-busca">

                <div>
                    <label for="text">Buscar produto:</label>

                    <input
                        type="text"
                        id="text"
                        name="nome_produto"
                        placeholder="Digite o nome do produto..."
                    >
                </div>

                <button
                    type="submit"
                    class="btn-buscar">
                    Buscar
                </button>

            </form>

            <p id="mensagem"></p>

        </div>


        <!-- TABELA DO ESTOQUE -->

        <div class="tabela-container">

            <table>

                <thead>

                    <tr>
                        <th>N. produto</th>
                        <th>Qtd</th>
                        <th>Preço</th>
                        <th>Categoria</th>
                        <th>Código do Produto</th>
                    </tr>

                </thead>


                <tbody id="lista-produtos">

                    <!-- Produtos carregados pela API -->

                </tbody>

            </table>

        </div>

    </main>


    <script>

        const API = "http://127.0.0.1:3000/produtos";

        const listaProdutos =
            document.getElementById("lista-produtos");

        const formularioBusca =
            document.getElementById("form-busca");

        const campoBusca =
            document.getElementById("text");

        const mensagem =
            document.getElementById("mensagem");


        // ==========================================
        // CARREGAR PRODUTOS
        // ==========================================

        async function carregarProdutos() {

            try {

                mensagem.textContent = "Carregando estoque...";

                const resposta = await fetch(API);

                const produtos = await resposta.json();

                if (!resposta.ok) {

                    throw new Error(
                        produtos.mensagem ||
                        "Erro ao carregar estoque."
                    );

                }


                // Limpa a tabela

                listaProdutos.innerHTML = "";


                // Somente produtos ativos

                const produtosAtivos =
                    produtos.filter(produto => produto.Ativo === true);


                if (produtosAtivos.length === 0) {

                    listaProdutos.innerHTML = `
                        <tr>
                            <td colspan="5">
                                Nenhum produto encontrado.
                            </td>
                        </tr>
                    `;

                    mensagem.textContent =
                        "Nenhum produto ativo no estoque.";

                    return;
                }


                // Criar linhas

                produtosAtivos.forEach(produto => {

                    const linha =
                        document.createElement("tr");


                    const classeQuantidade =
                        produto.Quantidade <= 5
                            ? "estoque-baixo"
                            : "estoque-normal";


                    linha.innerHTML = `

                        <td>
                            ${produto.IdProduto}
                        </td>

                        <td class="${classeQuantidade}">
                            ${produto.Quantidade}
                        </td>

                        <td>
                            R$ ${Number(produto.Preco)
                                .toFixed(2)
                                .replace(".", ",")}
                        </td>

                        <td>
                            ${produto.Categoria || "Sem categoria"}
                        </td>

                        <td>
                            ${produto.CodigoProduto}
                        </td>

                    `;


                    listaProdutos.appendChild(linha);

                });


                mensagem.textContent =
                    `${produtosAtivos.length} produto(s) encontrado(s).`;


            } catch (erro) {

                console.error(erro);

                mensagem.textContent =
                    "Erro ao carregar estoque: " + erro.message;

            }

        }


        // ==========================================
        // BUSCAR POR NOME
        // ==========================================

        formularioBusca.addEventListener(
            "submit",
            async (evento) => {

                evento.preventDefault();

                const busca =
                    campoBusca.value.trim().toLowerCase();


                try {

                    mensagem.textContent =
                        "Buscando produto...";


                    const resposta =
                        await fetch(API);


                    const produtos =
                        await resposta.json();


                    if (!resposta.ok) {

                        throw new Error(
                            produtos.mensagem ||
                            "Erro ao buscar produtos."
                        );

                    }


                    listaProdutos.innerHTML = "";


                    const produtosAtivos =
                        produtos.filter(
                            produto => produto.Ativo === true
                        );


                    const encontrados =
                        produtosAtivos.filter(
                            produto =>
                                produto.Nome
                                    .toLowerCase()
                                    .includes(busca)
                        );


                    if (encontrados.length === 0) {

                        listaProdutos.innerHTML = `
                            <tr>
                                <td colspan="5">
                                    Nenhum produto encontrado.
                                </td>
                            </tr>
                        `;

                        mensagem.textContent =
                            "Nenhum produto encontrado.";

                        return;
                    }


                    encontrados.forEach(produto => {

                        const linha =
                            document.createElement("tr");


                        const classeQuantidade =
                            produto.Quantidade <= 5
                                ? "estoque-baixo"
                                : "estoque-normal";


                        linha.innerHTML = `

                            <td>
                                ${produto.IdProduto}
                            </td>

                            <td class="${classeQuantidade}">
                                ${produto.Quantidade}
                            </td>

                            <td>
                                R$ ${Number(produto.Preco)
                                    .toFixed(2)
                                    .replace(".", ",")}
                            </td>

                            <td>
                                ${produto.Categoria ||
                                "Sem categoria"}
                            </td>

                            <td>
                                ${produto.CodigoProduto}
                            </td>

                        `;


                        listaProdutos.appendChild(linha);

                    });


                    mensagem.textContent =
                        `${encontrados.length} produto(s) encontrado(s).`;

                } catch (erro) {

                    console.error(erro);

                    mensagem.textContent =
                        "Erro ao buscar: " + erro.message;

                }

            }
        );


        // ==========================================
        // CARREGAR ESTOQUE AO ABRIR A PÁGINA
        // ==========================================

        carregarProdutos();

    </script>

</body>
</html>
